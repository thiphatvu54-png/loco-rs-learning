<h1>中间件 Pipeline 速查</h1>
<pre><code>配置全局：server.middlewares.*
局部路由：Routes::layer(...)
验证配置：cargo loco middleware --config</code></pre>
<table><tr><th>方向</th><th>顺序</th></tr><tr><td>请求进入</td><td>最后添加 → 最先添加 → handler</td></tr><tr><td>响应返回</td><td>handler → 最先添加 → 最后添加</td></tr></table>
<p>默认启用的 middleware 如果显式写入配置，通常要同时写 <code>enable: true</code>。</p>
