<h1>401 与 403</h1>
<table><tr><th>状态</th><th>判断</th><th>排查点</th></tr><tr><td>401</td><td>身份未确认</td><td>header、token、secret、用户是否存在</td></tr><tr><td>403</td><td>身份已确认但无权限</td><td>角色、资源所有者、组织策略</td></tr></table>
<pre><code>// extractor 失败
JWT / JWTWithUser → 401

// handler 业务授权失败
Error::CustomError(StatusCode::FORBIDDEN, detail) → 403</code></pre>
<p><strong>客户端行为：</strong>401 通常重新登录或刷新 token；403 保留当前身份并提示权限不足。</p>
<p class="source"><a href="https://loco.rs/docs/how-to/jwt-auth/">官方 JWT auth</a> · <a href="https://loco.rs/docs/how-to/handle-errors/">官方错误处理</a></p>
